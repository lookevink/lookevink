name: Generate profile statistics

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Generate repository-hosted statistics
        uses: cicirello/user-statistician@1c77e7a9c65279eccdfe12843255e10c7b62adb5 # v1.26.1
        with:
          colors: dark-dimmed
          custom-title: GitHub, approximately
          hide-keys: private, sponsors, sponsoring, mostStarred, mostForked
          animated-language-chart: true
          commit-and-push: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create statistics update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: images/userstats.svg
          branch: automation/update-profile-statistics
          commit-message: "chore: update profile statistics"
          delete-branch: true
          title: "chore: update profile statistics"
          body: "Automated update of the repository-hosted profile statistics."
