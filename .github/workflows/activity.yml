name: Update latest public activity

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: profile-activity
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Update activity list
        uses: gautamkrishnar/blog-post-workflow@2786e54a01b71aec80a5118c2bd6b5044e842597 # v1.9.6
        with:
          feed_list: "https://github.com/lookevink.atom"
          max_post_count: 5
          enable_keepalive: false
          skip_commit: true

      - name: Create activity update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: README.md
          branch: automation/update-profile-activity
          commit-message: "chore: update latest public activity"
          delete-branch: true
          title: "chore: update latest public activity"
          body: "Automated update from the latest public GitHub activity."
